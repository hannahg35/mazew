[package]
name = "maze2"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"

[features]
    default = ["native"]  # Default feature includes "native"
    native = ["dep:rayon"]    # The "native" feature enables Rayon

rayon = ["dep:rayon"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.7", optional = true }
